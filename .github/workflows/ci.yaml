name: RiskStream - CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Restrict permissions to read-only for the repository contents
permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Python version must match the base image in the Dockerfile (3.13)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # src/ must be on PYTHONPATH so riskstream_model is importable during tests
      - name: Run automated tests
        env:
          PYTHONPATH: src
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t riskstream-api:${{ github.sha }} .
